<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Kal 💖</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        flex-direction: column;
        text-align: center;
        overflow: hidden;
    }
    button {
        padding: 25px 50px;
        font-size: 28px;
        background: #ff6b81;
        color: white;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: transform 0.2s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    button:hover {
        transform: scale(1.1);
    }
    #confetti-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    #slideshow {
        display: none;
        margin-top: 30px;
        max-width: 80%;
        max-height: 50%;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        animation: fadeIn 1.5s forwards;
    }
    #message {
        display: none;
        margin-top: 20px;
        font-size: 36px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 15px #ff6b81, 0 0 30px #ff9a9e, 0 0 50px #fad0c4;
        animation: glow 1.5s infinite alternate;
    }
    #custom-text {
        display: none;
        margin-top: 20px;
        font-size: 28px;
        color: #fff;
        text-shadow: 0 0 10px #ff6b81, 0 0 20px #ff9a9e;
        animation: fadeInText 2s forwards;
        max-width: 80%;
    }
    @keyframes glow {
        0% { text-shadow: 0 0 10px #ff6b81, 0 0 20px #ff9a9e; }
        100% { text-shadow: 0 0 25px #ff6b81, 0 0 50px #ff9a9e; }
    }
    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }
    @keyframes fadeInText {
        from {opacity: 0;}
        to {opacity: 1;}
    }
</style>
</head>
<body>

<button id="surpriseBtn">🎁 Click for a Surprise ❤️</button>

<canvas id="confetti-canvas"></canvas>

<img id="slideshow" alt="Slideshow Image">
<div id="message">Happy Birthday, Kal 💖</div>
<div id="custom-text">
    Happy Birthday the queen of my heart<br>
    I wish you a year full of happiness, <br><br><b>Takialesh degmo endemwedsh 💖</b>
</div>

<audio id="bgMusic" src="song.m4a"></audio>
<script>
    const btn = document.getElementById('surpriseBtn');
    const msg = document.getElementById('message');
    const slideshow = document.getElementById('slideshow');
    const customText = document.getElementById('custom-text');

    // YouTube embed
    let musicPlayer;

    btn.addEventListener('click', () => {
        btn.style.display = 'none';
        startConfetti();
        playMusic();
        startSlideshow();
        msg.style.display = 'block';
        customText.style.display = 'block';
    });

    // --- Confetti Effect ---
    function startConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const confettiCount = 150;
        const confetti = [];

        for(let i=0; i<confettiCount; i++){
            confetti.push({
                x: Math.random()*canvas.width,
                y: Math.random()*canvas.height - canvas.height,
                r: Math.random()*6+4,
                d: Math.random()*confettiCount,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                tilt: Math.random()*10 - 10,
                tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                tiltAngle: 0
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let i=0;i<confettiCount;i++){
                const c = confetti[i];
                ctx.beginPath();
                ctx.lineWidth = c.r/2;
                ctx.strokeStyle = c.color;
                ctx.moveTo(c.x + c.tilt + c.r/4, c.y);
                ctx.lineTo(c.x + c.tilt, c.y + c.tilt + c.r/4);
                ctx.stroke();
            }
            update();
            requestAnimationFrame(draw);
        }

        function update() {
            for(let i=0;i<confettiCount;i++){
                const c = confetti[i];
                c.tiltAngle += c.tiltAngleIncremental;
                c.y += (Math.cos(c.d) + 3 + c.r/2)/2;
                c.x += Math.sin(c.d);
                c.tilt = Math.sin(c.tiltAngle) * 15;

                if(c.y > canvas.height){
                    c.x = Math.random()*canvas.width;
                    c.y = -20;
                    c.tilt = Math.random()*10 - 10;
                }
            }
        }

        draw();
    }

    // --- Music Player ---
  function playMusic() {
    const music = document.getElementById("bgMusic");
    music.play();
}

    // --- Slideshow ---
    let images = [];

    // Automatically get all PNG images in folder
    // You need to manually add image names here:
    images = ["image1.jpg", "image2.jpg", "image3.jpg","image4.jpg","image5.jpg","image6.jpg"]; // replace with your actual PNG filenames

    let index = 0;

    function startSlideshow() {
        if (images.length === 0) return;
        slideshow.src = images[index];
        slideshow.style.display = 'block';
        setInterval(() => {
            index = (index + 1) % images.length;
            slideshow.src = images[index];
        }, 3000);
    }
</script>
</body>
</html>
